[package]
name = "akooti-core"
description = "Akooti core: crypto, SQLCipher storage, routing, audit and imports (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
argon2 = "0.5"
chacha20poly1305 = "0.10"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
thiserror = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
tempfile = "3"
