[package]
name = "akooti-core"
description = "Akooti core: crypto, SQLCipher storage, routing, audit and imports (no UI dependencies)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
aes = "0.8"
argon2 = "0.5"
base32 = "0.5"
base64 = "0.22"
cbc = { version = "0.1", features = ["alloc", "block-padding"] }
chacha20poly1305 = "0.10"
csv = "1.4"
encoding_rs = "0.8"
flate2 = "1"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
keepass = { version = "0.17", features = ["save_kdbx4"] }
p256 = { version = "0.13", features = ["ecdsa"] }
pbkdf2 = "0.12"
quick-xml = { version = "0.42", features = ["serde"] }
rand_core = { version = "0.6", features = ["getrandom"] }
regex = "1"
rusqlite = { version = "0.41", features = ["bundled-sqlcipher"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
strsim = "0.11"
subtle = "2"
thiserror = "2"
totp-rs = { version = "5", features = ["zeroize"] }
tracing = "0.1"
url = "2"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
zip = { version = "9.6", default-features = false, features = ["deflate"] }
zxcvbn = "3.1"

[dev-dependencies]
# Recomputed in `health_test.rs`: a digest checked with the code that produced
# it would prove nothing.
sha1 = "0.10"
# Verification of the ES256 signatures in `tests/passkey_test.rs`: a test that
# checked a signature with the code that produced it would prove nothing.
p256 = { version = "0.13", features = ["ecdsa"] }
sha2 = "0.10"
tempfile = "3"
