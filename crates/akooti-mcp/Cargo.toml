[package]
name = "akooti-mcp"
description = "Akooti MCP server and Zero-Leak injection engines"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
akooti-ipc = { path = "../akooti-ipc" }
rmcp = { version = "3.10", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
