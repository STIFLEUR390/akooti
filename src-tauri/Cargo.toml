[package]
name = "akooti"
description = "Akooti desktop app, daemon, CLI and MCP entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "akooti_lib"

[[bin]]
name = "akooti"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
akooti-core = { path = "../crates/akooti-core" }
tauri = { version = "2", features = [] }
tauri-plugin-mcp-bridge = "0.13"
tracing = "0.1"
