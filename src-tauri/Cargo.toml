[package]
name = "akooti"
description = "Akooti desktop app, daemon, CLI and MCP entrypoint"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "akooti_lib"

[[bin]]
name = "akooti"
path = "src/main.rs"

[lints]
workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
akooti-core = { path = "../crates/akooti-core" }
akooti-ipc = { path = "../crates/akooti-ipc" }
akooti-mcp = { path = "../crates/akooti-mcp" }
base64 = "0.22"
hex = "0.4"
hmac = "0.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-cli = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-mcp-bridge = "0.13"
tauri-plugin-updater = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
ureq = "3"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
