[workspace]
resolver = "3"
members = ["crates/akooti-core", "crates/akooti-ipc", "crates/akooti-mcp", "src-tauri"]

[workspace.package]
version = "1.0.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/STIFLEUR390/akooti"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "warn"
todo = "warn"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
panic = "abort"
