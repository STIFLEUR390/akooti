name: Bug report
description: Signaler un comportement inattendu (sans secret ni donnée de coffre)
title: "bug: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Ne joignez jamais** de mot de passe, clé, code TOTP, export de coffre ou
        capture montrant un secret. Utilisez des valeurs factices.
        Pour une faille de sécurité, voir le modèle « Security report ».
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il, et que devrait-il se passer ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Ouvrir …
        2. Cliquer sur …
        3. Observer …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version d'Akooti
      placeholder: "0.1.0 (commit abc1234)"
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Système
      options: [Linux, macOS, Windows]
    validations:
      required: true
  - type: dropdown
    id: component
    attributes:
      label: Composant
      options:
        - Application desktop
        - Extension navigateur
        - Serveur MCP / CLI
        - Import / export
        - Synchronisation / sauvegarde
        - Cryptographie / base locale
        - Autre
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs pertinents (expurgés)
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Confidentialité
      options:
        - label: J'ai vérifié qu'aucun secret ne figure dans ce rapport.
          required: true
